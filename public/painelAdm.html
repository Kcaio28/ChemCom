<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Produto</title>
</head>

<body>

    <form id="formCadastroProdutos" enctype="multipart/form-data" method="POST">

        <label>Nome:</label>
        <input type="text" name="nome" required>

        <label>Descrição:</label>
        <textarea name="descricao" required></textarea>

        <label>Preço:</label>
        <input type="number" name="preco" required>

        <label for="categoria">Categoria:</label>
        <select id="categoria" name="categoria" required>
            <option value="">Selecione...</option>
            <option value="Ácido">Ácido</option>
            <option value="Base">Base</option>
            <option value="Sal">Sal</option>
            <option value="Solvente">Solvente</option>
            <option value="Polímero">Polímero</option>
            <option value="Agricultura">Agricultura</option>
            <option value="Farmacêuticos">Farmacêuticos</option>
            <option value="Cosméticos">Cosméticos</option>
            <option value="Reagente">Reagente</option>
        </select>

        <label for="classificacao">Classificação:</label>
        <select id="classificacao" name="id_classificacao" required>
            <option value="">Selecione...</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
        </select>

        <label>Imagem do Produto:</label>
        <input type="file" name="imagem1" accept="image/*" required>

        <button type="submit">CADASTRAR</button>
    </form>

    <script src="js/cadastro_produtos.js"></script>

</body>

</html>
