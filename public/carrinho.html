<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com 'unsafe-inline'; script-src 'self' https://cdn.jsdelivr.net https://cdn.jsdelivr.net/npm 'unsafe-inline' 'unsafe-eval'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self' https://cdn.jsdelivr.net;">

    <title>ChemCom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="container-fluid top-bar">
            <!-- Logo minimalista -->
            <div class="logo">
                <a href="home.html" id="inicio"><img src="./images/logo_mini.png" alt="Logo" /></a>
            </div>

            <!-- Barra de pesquisa -->
            <div class="search-bar">
                <div class="input-group">
                    <span class="input-group-text">
                        <img src="./images/icons/icon_search.svg" alt="Buscar" width="18" height="18" />
                    </span>
                    <input type="text" class="form-control form-header" placeholder="Pesquisar..." />
                </div>
            </div>

            <!-- Carrinho -->
            <div class="d-flex align-items-center gap-3">
                <a href="carrinho.html" class="icon-btn text-menu">
                    <img src="./images/icons/icon_carrinho.svg" alt="Carrinho" width="22" height="22" />
                    Carrinho
                </a>

                <!-- Conta -->
                <a href="login_cliente.html" class="icon-btn text-menu">
                    <img src="./images/icons/icon_user.svg" alt="Usuário" width="22" height="22" />
                    Conta
                </a>
            </div>
        </div>

        <!-- Menu inferior -->
        <nav class="navbar navbar-expand-lg menu-bar">
            <div class="container-fluid">
                <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse"
                    data-bs-target="#menuNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menuNav">
                    <ul class="navbar-nav">
                        <li class="nav-item text-menu">
                            <a class="nav-link" href="catalogo.html">Catálogo</a>
                        </li>
                        <li class="nav-item text-menu">
                            <a class="nav-link" href="empresas.html">Empresas</a>
                        </li>
                        <li class="nav-item text-menu">
                            <a class="nav-link" href="sobre.html">Sobre</a>
                        </li>
                        <li class="nav-item text-menu">
                            <a class="nav-link" href="contato.html">Contato</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>



    <div class="container-carrinho">

        <section class="carrinho">

            <h1>Carrinho</h1>
            <hr class="divisor-carrinho">

            <h2>Itens</h2>

            <div class="item-carrinho">
                <img src="images/logo_mini.png" class="img-item-carrinho" />
                <div class="detalhes-item-carrinho">
                    <h3>Nome do Produto</h3>
                    <p><a href="#" target="_blank">Documentos do produto</a></p>
                    <p>Empresa: ChemCom</p>
                    <div>
                        <div>
                            <label for="quantidade">Quantidade:</label>
                            <input type="number" id="quantidade" name="quantidade" min="1" value="1" required/>
                        </div>
                        <div class="preco-carrinho">
                            <span>R$ 697,07</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>



        <aside class="resumo-carrinho">
            <h2>Sumário</h2>
            <hr class="divisor-carrinho">

            <ul>
                <li><span>Subtotal</span> <strong>R$697,07</strong></li>
            </ul>

            <div class="total-carrinho">
                <span>Total</span>
                <strong>R$697,07</strong>
            </div>

            <a href="pagamento.html"><button class="btn-finalizar-carrinho">Seguir para Pagamento</button></a>

        </aside>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
</body>

</html>
