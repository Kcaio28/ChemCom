<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Pedidos - Admin</title>
    <link rel="stylesheet" href="style.css">

    <style>
        h1 {
            margin-bottom: 20px;
        }

        .filtros-avancados {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .filtros-avancados input,
        .filtros-avancados select,
        .filtros-avancados button {
            padding: 8px;
        }

        table {
            width: 100%;
            background: #fff;
            border-collapse: collapse;
            border-radius: 8px;
            overflow: hidden;
        }

        thead {
            background: #222;
            color: #fff;
        }

        td, th {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        .btn-acao {
            background: #3498db;
            border: none;
            color: white;
            padding: 6px 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
        }

        .status-pendente { background: #f1c40f; color: #000; }
        .status-concluido { background: #2ecc71; }
        .status-cancelado { background: #e74c3c; }
        .status-no\ carrinho { background: #7f8c8d; }

        .paginacao {
            margin-top: 20px;
            text-align: center;
        }

        .btn-pag {
            padding: 8px 12px;
            margin: 3px;
            border: 1px solid #555;
            background: #fff;
            cursor: pointer;
        }

        .btn-pag.active {
            background: #555;
            color: #fff;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .modal-content {
            background: #fff;
            padding: 20px;
            width: 700px;
            border-radius: 10px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-fechar {
            background: transparent;
            border: none;
            font-size: 26px;
            cursor: pointer;
        }
    </style>

    <!-- Icon na aba do navegador -->
     <link rel="icon" href="./images/logo_mini.png" type="image/png">
</head>
<body>

    <header>
        <div class="container-fluid top-bar">
            <!-- Logo minimalista -->
            <div class="logo">
                <a href="home.html" id="inicio"><img src="./images/logo_mini.png" alt="Logo" /></a>
            </div>

            

            <!-- botão logar -->
            <div class="d-flex align-items-center gap-3" id="divLogin">
                <a href="login_cliente.html" class="icon-btn text-menu btn-saiba-transporte">
                    Entrar
                </a>
            </div>

            <!-- Carrinho -->
            <div class="d-none align-items-center gap-3" id="divCarrinho">
                <a href="carrinho.html" class="icon-btn text-menu">
                    <img src="./images/icons/icon_carrinho.svg" alt="Carrinho" width="22" height="22" />
                    Carrinho
                </a>

                <!-- Conta com Dropdown -->
                <div class="conta-dropdown-wrapper">
                    <a href="#" class="icon-btn text-menu" id="btnConta">
                        <img src="./images/icons/icon_user.svg" alt="Usuário" width="22" height="22" />
                        Conta
                    </a>

                    <!-- Dropdown de logout -->
                    <div class="conta-dropdown" id="contaDropdown">
                        <div class="dropdown-header">
                            <img src="./images/icons/icon_user.svg" alt="Usuário" width="30" height="30" />
                            <span class="user-name" id="userName">Nome do Usuário</span>
                        </div>
                        <a href="pedidouser.html" target="_blank"><button class="btn-pedidos">Meus Pedidos</button></a>
                        <button class="btn-sair" id="btnSair">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                                <path
                                    d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0v2z" />
                                <path
                                    d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708l3-3z" />
                            </svg>
                            Sair
                        </button>
                    </div>
                </div>
            </div>

            <!-- ADM -->
            <div class="d-none align-items-center gap-3" id="painelAdm">
                <a href="painelAdm.html" class="icon-btn text-menu">
                    <img src="./images/icons/icon_user.svg" alt="Usuário" width="22" height="22" />
                    ADM
                </a>
            </div>
        </div>

        <!-- Menu inferior -->
        <nav class="navbar navbar-expand-lg menu-bar">
            <div class="container-fluid">
                <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse"
                    data-bs-target="#menuNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menuNav">
                    <ul class="navbar-nav">
                        <li class="nav-item text-menu">
                            <a class="nav-link" href="catalogo.html">Catálogo</a>
                        </li>
                        <li class="nav-item text-menu">
                            <a class="nav-link" href="empresas.html">Empresas</a>
                        </li>
                        <li class="nav-item text-menu">
                            <a class="nav-link" href="sobre.html">Sobre</a>
                        </li>
                        <li class="nav-item text-menu">
                            <a class="nav-link" href="contato.html">Contato</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

<section class="container-admin-pedidos">
    <h1>Gestão de Pedidos</h1>

    <!-- FILTROS AVANÇADOS -->
    <div class="filtros-avancados">
        <input type="date" id="dataInicio">
        <input type="date" id="dataFim">

        <select id="filtroStatus">
            <option value="">Todos os status</option>
            <option value="NO CARRINHO">Carrinho</option>
            <option value="PENDENTE">Pendente</option>
            <option value="CONCLUIDO">Concluído</option>
            <option value="CANCELADO">Cancelado</option>
        </select>

        <input type="text" id="filtroCliente" placeholder="Cliente...">

        <button id="btnFiltrar">Filtrar</button>
    </div>

    <!-- TABELA DE PEDIDOS -->
    <div class="tabela-pedidos">
        <table>
            <thead>
                <tr>
                    <th>Nº Pedido</th>
                    <th>Cliente</th>
                    <th>Data</th>
                    <th>Itens</th>
                    <th>Valor Total</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaPedidos">
                <tr>
                    <td colspan="7" style="text-align: center; padding: 20px;">
                        Carregando pedidos...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- PAGINAÇÃO -->
    <div class="paginacao" id="paginacao"></div>

</section>

<!-- IMPORTA O JS DO GERENCIADOR -->
<script src="js/pedido-adm.js"></script>

</body>
</html>
