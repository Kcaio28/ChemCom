<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="cadastro.css">
  </head>

  <body>
    <header>
      <div class="container-fluid top-bar">
        <!-- Logo minimalista -->
        <div class="logo">
          <a href="home.html"
            ><img src="./images/logo_mini.png" alt="Logo"
          /></a>
        </div>

        <!-- Barra de pesquisa -->
        <div class="search-bar">
          <div class="input-group">
            <span class="input-group-text">
              <img
                src="./images/icons/icon_search.svg"
                alt="Buscar"
                width="18"
                height="18"
              />
            </span>
            <input
              type="text"
              class="form-control"
              placeholder="Pesquisar..."
            />
          </div>
        </div>

        <!-- Carrinho -->
        <div class="d-flex align-items-center gap-3">
          <a href="" class="icon-btn text-menu">
            <img
              src="./images/icons/icon_carrinho.svg"
              alt="Carrinho"
              width="22"
              height="22"
            />
            Carrinho
          </a>

          <!-- Conta -->
          <a href="login_cliente.html" class="icon-btn text-menu">
            <img
              src="./images/icons/icon_user.svg"
              alt="Usuário"
              width="22"
              height="22"
            />
            Conta
          </a>
        </div>
      </div>

      <!-- Menu inferior -->
      <nav class="navbar navbar-expand-lg menu-bar">
        <div class="container-fluid">
          <button
            class="navbar-toggler border-0"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menuNav"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="menuNav">
            <ul class="navbar-nav">
              <li class="nav-item text-menu">
                <a class="nav-link" href="produtos.html">Catálogo</a>
              </li>
              <li class="nav-item text-menu">
                <a class="nav-link" href="">Empresas</a>
              </li>
              <li class="nav-item text-menu">
                <a class="nav-link" href="sobre.html">Sobre</a>
              </li>
              <li class="nav-item text-menu">
                <a class="nav-link" href="contato.html">Contato</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <div class="container-fluid">
      <div class="row">
        <div class="col">
          <h2>Cadastro de Clientes</h2>
          <form id="formCadastro">
            <label>Nome Da Empresa:</label>
            <input type="text" name="nome" required />
            <label>CNPJ:</label>
            <input type="text" name="cnpj" required />
            <label>Email:</label>
            <input type="email" name="email" required />
            <label>Senha:</label>
            <input type="password" name="senha" required />
            <label>Telefone</label>
            <input type="number" name="telefone" required />
            <label>CEP:</label>
            <input type="number" name="cep" required />
            <label>Estado</label>
            <input type="text" name="estado" required />
            <label>Cidade</label>
            <input type="text" name="cidade" required />
            <label>Número</label>
            <input type="number" name="numero" required />
            <label>ID</label>
            <input type="number" name="id" required />
            <label>Logradouro:</label>
            <input type="text" name="logradouro" required />
            <button type="submit">Cadastrar</button>
          </form>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="/public/js/cadastro.js"></script>
  </body>
</html>
