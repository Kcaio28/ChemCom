<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Meus Pedidos</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    /* Filtro */
    .filtros {
      margin-bottom: 20px;
    }

    select {
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    /* Cards */
    .card-pedido {
      background: #fff;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 1px 4px #0001;
    }

    .pedido-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .pedido-status {
      padding: 4px 8px;
      border-radius: 4px;
      color: #fff;
      font-size: 0.9rem;
    }

    .status-pendente { background: #d8a500; }
    .status-concluido { background: #28a745; }
    .status-cancelado { background: #dc3545; }
    .status-no\ carrinho { background: #6c757d; }

    .pedido-body {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-detalhes {
      background: #007bff;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    /* Paginação */
    #paginacao {
      margin-top: 20px;
      text-align: center;
    }

    .btn-pag {
      padding: 8px 12px;
      margin: 3px;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
      border-radius: 4px;
    }

    .btn-pag.active {
      background: #007bff;
      color: #fff;
      font-weight: bold;
    }

    .btn-pag:disabled {
      background: #eee;
      cursor: not-allowed;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0007;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-content {
      background: #fff;
      width: 600px;
      max-width: 95%;
      border-radius: 8px;
      padding: 20px;
      animation: fadeIn .3s;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-fechar {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
    }

    .tabela-itens {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    .tabela-itens th, .tabela-itens td {
      padding: 8px;
      border-bottom: 1px solid #ccc;
      text-align: left;
    }

    .alert-erro {
      background: #ffc2c2;
      padding: 15px;
      border-radius: 8px;
      color: #b30000;
      text-align: center;
    }
  </style>

  <!-- Icon na aba do navegador -->
     <link rel="icon" href="./images/logo_mini.png" type="image/png">
</head>
<body>

  <header>
        <div class="container-fluid top-bar">
            <!-- Logo minimalista -->
            <div class="logo">
                <a href="home.html" id="inicio"><img src="./images/logo_mini.png" alt="Logo" /></a>
            </div>

            

            <!-- botão logar -->
            <div class="d-flex align-items-center gap-3" id="divLogin">
                <a href="login_cliente.html" class="icon-btn text-menu btn-entrar">
                    Entrar
                </a>
            </div>

            <!-- Carrinho -->
            <div class="d-none align-items-center gap-3" id="divCarrinho">
                <a href="carrinho.html" class="icon-btn text-menu">
                    <img src="./images/icons/icon_carrinho.svg" alt="Carrinho" width="22" height="22" />
                    Carrinho

                <!-- Conta com Dropdown -->
                <div class="conta-dropdown-wrapper">

                        <a href="pedidouser.html" target="_blank"><button class="btn-pedidos">Meus Pedidos</button></a>
                        <button class="btn-sair" id="btnSair">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                                <path
                                    d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0v2z" />
                                <path
                                    d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708l3-3z" />
                            </svg>
                            Sair
                        </button>
                    </div>
                </div>
            </div>

            <!-- ADM -->
            <div class="d-none align-items-center gap-3" id="painelAdm">
                <a href="painelAdm.html" class="icon-btn text-menu">
                    <img src="./images/icons/icon_user.svg" alt="Usuário" width="22" height="22" />
                    ADM
                </a>
            </div>
        </div>

        <!-- Menu inferior -->
        <nav class="navbar navbar-expand-lg menu-bar">
            <div class="container-fluid">
                <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse"
                    data-bs-target="#menuNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menuNav">
                    <ul class="navbar-nav">
                        <li class="nav-item text-menu">
                            <a class="nav-link" href="catalogo.html">Catálogo</a>
                        </li>
                        <li class="nav-item text-menu">
                            <a class="nav-link" href="empresas.html">Empresas</a>
                        </li>
                        <li class="nav-item text-menu">
                            <a class="nav-link" href="sobre.html">Sobre</a>
                        </li>
                        <li class="nav-item text-menu">
                            <a class="nav-link" href="contato.html">Contato</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

  <h1>Meus Pedidos</h1>

  <!-- Filtro -->
  <div class="filtros">
    <label for="filtroStatus">Filtrar por status:</label>
    <select id="filtroStatus">
      <option value="">Todos</option>
      <option value="PENDENTE">Pendente</option>
      <option value="CONCLUIDO">Concluído</option>
      <option value="CANCELADO">Cancelado</option>
      <option value="NO CARRINHO">Carrinho</option>
    </select>
  </div>

  <!-- Lista de pedidos -->
  <div id="listaPedidos"></div>

  <!-- Paginação -->
  <div id="paginacao"></div>

  <!-- Importar seu JS -->
  <script src="js/pedidos-user.js"></script>

</body>
</html>
