<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com 'unsafe-inline'; script-src 'self' https://cdn.jsdelivr.net https://cdn.jsdelivr.net/npm 'unsafe-inline' 'unsafe-eval'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self' https://cdn.jsdelivr.net;">

  <title>ChemCom</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <div class="container-fluid top-bar">
      <!-- Logo minimalista -->
      <div class="logo">
        <a href="home.html" id="inicio"><img src="./images/logo_mini.png" alt="Logo" /></a>
      </div>

      <!-- Barra de pesquisa -->
      <div class="search-bar">
        <div class="input-group">
          <span class="input-group-text">
            <img src="./images/icons/icon_search.svg" alt="Buscar" width="18" height="18" />
          </span>
          <input type="text" class="form-control form-header" placeholder="Pesquisar..." />
        </div>
      </div>

      <!-- Carrinho -->
      <div class="d-flex align-items-center gap-3">
        <a href="carrinho.html" class="icon-btn text-menu">
          <img src="./images/icons/icon_carrinho.svg" alt="Carrinho" width="22" height="22" />
          Carrinho
        </a>

        <!-- Conta -->
        <a href="login_cliente.html" class="icon-btn text-menu">
          <img src="./images/icons/icon_user.svg" alt="Usuário" width="22" height="22" />
          Conta
        </a>
      </div>
    </div>

    <!-- Menu inferior -->
    <nav class="navbar navbar-expand-lg menu-bar">
      <div class="container-fluid">
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#menuNav">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuNav">
          <ul class="navbar-nav">
            <li class="nav-item text-menu">
              <a class="nav-link" href="catalogo.html">Catálogo</a>
            </li>
            <li class="nav-item text-menu">
              <a class="nav-link" href="empresas.html">Empresas</a>
            </li>
            <li class="nav-item text-menu">
              <a class="nav-link" href="sobre.html">Sobre</a>
            </li>
            <li class="nav-item text-menu">
              <a class="nav-link" href="contato.html">Contato</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>



  <div class="container-pagamento">

    <section class="pagamento">

      <h1>Pagamento</h1>
      <hr class="divisor-pagamento">

      <h2>Forma de Pagamento</h2>

      <div class="opcoes-pagamento">
        <div class="opcao-pagamento active">
          <img src="https://img.icons8.com/ios-filled/100/bank-card-back-side.png" />
          <span>Cartão Corporativo</span>
        </div>

        <div class="opcao-pagamento">
          <img src="https://img.icons8.com/ios-filled/100/pix.png" />
          <span>Pix</span>
        </div>

        <div class="opcao-pagamento">
          <img src="https://img.icons8.com/ios-filled/100/barcode.png" />
          <span>Boleto</span>
        </div>
      </div>

      <form class="form-cartao">

        <label>Titular do Cartão:</label>
        <input type="text">

        <label>Número do Cartão:</label>
        <input type="text">

        <label>Data de Validade:</label>
        <div class="validade">
          <select>
            <option>Mês</option>
            <option>01</option>
            <option>02</option>
            <option>03</option>
          </select>

          <span>/</span>

          <select>
            <option>Ano</option>
            <option>2025</option>
            <option>2026</option>
            <option>2027</option>
          </select>
        </div>

        <label>Código de Segurança:</label>
        <input type="text">

        <label>Parcelas:</label>
        <input type="text">

      </form>

    </section>

    <aside class="resumo-pagamento">
      <h2>Sumário</h2>
      <hr class="divisor-pagamento">

      <ul>
        <li><span>Subtotal</span> <strong>R$697,07</strong></li>
        <li><span>Descontos</span> <strong>R$697,07</strong></li>
        <li><span>Frete</span> <strong>R$697,07</strong></li>
      </ul>

      <div class="total-pagamento">
        <span>Total</span>
        <strong>R$697,07</strong>
      </div>

      <button class="btn-finalizar-pagamento">Finalizar Compra</button>

    </aside>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
    integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
    crossorigin="anonymous"></script>
</body>

</html>
