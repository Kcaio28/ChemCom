<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>[nome]</title>
    <link rel="icon" href="../imagens/icones/icon.png" type="image/png" />
    <link rel="stylesheet" href="../style.css" />
    <link rel="icon" href="../imagens/icones/icon.png" type="image/png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container"
        style="margin-top: 75px; background-color: white; padding-top: 50px; padding-bottom: 35px; border-radius: 20px;">
        <div class="row">
            <div class="col-2 col-md-1" sty>
                <div id="thumb-gallery" class="list-group" role="tablist">
                    <button class="list-group-item list-group-item-action active"
                        data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0">
                        <img src="../imagens/Produtos/imagens[0]" class="d-block w-100" alt="[nome] - Padrão">
                    </button>
                    <button class="list-group-item list-group-item-action" data-bs-target="#carouselExampleIndicators"
                        data-bs-slide-to="1">
                        <img src="../imagens/Produtos/imagens[1]" class="d-block w-100" alt="[nome] - Detalhe 1">
                    </button>
                    <button class="list-group-item list-group-item-action" data-bs-target="#carouselExampleIndicators"
                        data-bs-slide-to="2">
                        <img src="../imagens/Produtos/imagens[2]" class="d-block w-100" alt="[nome] - Detalhe 2">
                    </button>
                </div>
            </div>

            <!-- Coluna para o carrossel principal -->
            <div class="col-10 col-md-5">
                <div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="carousel">
                    <div class="carousel-inner">
                        <div class="carousel-item active"
                            style="height: 500px; object-fit: cover; border-radius: 10px; align-items: center;">
                            <img src="../imagens/Produtos/imagens[0]" class="d-block w-100" alt="[nome] - Padrão">
                        </div>
                        <div class="carousel-item"
                            style="height: 500px; object-fit: cover; border-radius: 10px; align-items: center;">
                            <img src="../imagens/Produtos/imagens[1]" class="d-block w-100"
                                alt="[nome] - Detalhe 1">
                        </div>
                        <div class="carousel-item"
                            style="height: 500px; object-fit: cover; border-radius: 10px; align-items: center;">
                            <img src="../imagens/Produtos/imagens[2]" class="d-block w-100"
                                alt="[nome] - Detalhe 2">
                        </div>
                    </div>
                    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators"
                        data-bs-slide="prev"
                        style="filter: invert(46%) sepia(87%) saturate(1907%) hue-rotate(180deg) brightness(95%) contrast(97%);">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Anterior</span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators"
                        data-bs-slide="next"
                        style="filter: invert(46%) sepia(87%) saturate(1907%) hue-rotate(180deg) brightness(95%) contrast(97%);">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Próximo</span>
                    </button>
                </div>
            </div>
            <div class="col-12 col-md-6">
                <h3 style="text-align: left;">[nome]</h3>
                <div class="linha-tp" style="border: none; height: 1.4px; background-color: #e0e0e0; margin: 1.5rem 0;">
                </div>
                <p class="h6">[descricao]</p>
                <div class="linha-tp" style="border: none; height: 1.2px; background-color: #e0e0e0; margin: 1.5rem 0;">
                </div>
                <h1 style="font-weight: bold; margin-left: 25px; margin-bottom: 10px; margin-top: -15px;">R$ [preco]
                </h1>
                <div class="linha-tp" style="border: none; height: 1.4px; background-color: #e0e0e0; margin: 1.5rem 0;">
                </div>
                <button type="button" id="botaoAdicionarAoCarrinho" class="btn btn-primary btn-lg"
                    style="font-size: 33px ; background-color: #0096eb; margin-left: 25px;"> Adicionar ao
                    carrinho.</button>

            </div>
        </div>
    </div>
    </div>

  </body>
</html>
